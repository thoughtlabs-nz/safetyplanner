server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — react-router owns /live, /journeys, etc., so any path
    # nginx doesn't have a file for must serve index.html, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets are immutable by construction.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
